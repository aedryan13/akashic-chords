<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Song requests</title>
<meta name="theme-color" content="#0E1116">
<style>
  :root { --bg: #0E1116; --panel: #171C24; --line: #2A3240; --fg: #EEF1F6; --muted: #9AA4B5; --accent: #5ED3C3; --on: #06221E; --warn: #E5B800; --ok: #30A46C; --bad: #E5484D; }
  @media (prefers-color-scheme: light) { :root { --bg: #F6F7FA; --panel: #FFFFFF; --line: #DDE2EA; --fg: #141821; --muted: #5B6575; --accent: #0E8F80; --on: #FFFFFF; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 0 16px 60px; }
  main { max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 26px 0 8px; }
  h1 { font-size: 1.7rem; margin: 0; }
  h2 { font-size: 1.15rem; margin: 22px 0 8px; }
  .muted { color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0 4px; }
  a.pill, button { font: inherit; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  button.primary, a.primary { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 700; }
  button:disabled { opacity: .5; }
  .linklist { display: grid; gap: 10px; margin: 12px 0; }
  .linkbtn { display: flex; align-items: center; justify-content: center; width: 100%; box-sizing: border-box; min-height: 52px; font-size: 1.05rem; font-weight: 600; text-align: center; }
  .lbio { margin: 12px 0; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 16px 0 8px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 2; }
  .tabs button[aria-pressed=true] { background: var(--accent); color: var(--on); border-color: var(--accent); font-weight: 700; }
  input, textarea, select { font: inherit; width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  textarea { min-height: 90px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .seg button { padding: 10px 6px; font-size: 1rem; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on); border-color: var(--accent); font-weight: 700; }
  .filters select { width: auto; }
  .filters { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .filters select { flex: 1 1 140px; min-height: 44px; font-size: 1rem; }
  .letter { font-weight: 800; opacity: .7; margin: 12px 4px 2px; font-size: 1.05rem; }
  .song { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; justify-content: flex-start; margin: 6px 0; padding: 10px 14px; min-height: 52px; }
  .song .t { font-weight: 700; } .song .a { color: var(--muted); font-size: .9rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 10px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 700; border: 1px solid var(--line); }
  .s-new { color: var(--warn); border-color: var(--warn); } .s-played { color: var(--ok); border-color: var(--ok); } .s-declined { color: var(--bad); border-color: var(--bad); } .s-looking, .s-working { color: var(--accent); border-color: var(--accent); }
  .qr { background: #fff; border-radius: 12px; padding: 8px; display: inline-block; } .qr svg { display: block; width: 150px; height: 150px; }
  .center { text-align: center; }
  .notice { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--warn); color: var(--fg); background: color-mix(in srgb, var(--warn) 12%, transparent); margin: 10px 0; }
  .hidden { display: none !important; }
  .chk { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; } .chk input { width: auto; min-height: 0; margin-top: 4px; }
  /* the performer's app theme (profile.theme) */
  body.themed { background: var(--bg) var(--art, none) center / cover fixed no-repeat; }
  body.themed::before { content: ""; position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 62%, transparent); pointer-events: none; z-index: -1; }
  body.themed .tabs { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); }
  body.themed .card, body.themed .song, body.themed input, body.themed select, body.themed textarea { background: color-mix(in srgb, var(--panel) 90%, transparent); }
  /* first-time guide */
  .guide { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
  .guide .gcard { background: var(--panel); color: var(--fg); border-radius: 20px; padding: 22px 20px; max-width: 520px; width: 100%; font-size: 1.25rem; line-height: 1.45; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); margin-bottom: env(safe-area-inset-bottom, 0px); }
  .guide .gbig { font-size: 3rem; line-height: 1; margin-bottom: 6px; }
  .guide h2 { font-size: 1.5rem; margin: 4px 0 8px; }
  .guide .gdots { display: flex; gap: 8px; justify-content: center; margin: 14px 0 4px; } .guide .gdots span { width: 12px; height: 12px; border-radius: 6px; background: var(--line); } .guide .gdots span.on { background: var(--accent); width: 28px; }
  .guide .row button { flex: 1; min-height: 56px; font-size: 1.2rem; }
  .helpbtn { margin-top: 10px; font-size: 1rem; }
  /* shows */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0; }
  .cal .dow { text-align: center; font-size: .8rem; color: var(--muted); font-weight: 700; }
  .cal button { min-height: 44px; padding: 0; border-radius: 10px; font-size: 1rem; }
  .cal button.has { background: var(--accent); color: var(--on); border-color: var(--accent); font-weight: 800; }
  .cal button.sel { outline: 3px solid var(--fg); }
  .cal .blank { min-height: 44px; }
  .calhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; } .calhead strong { font-size: 1.1rem; }
  .show .when { font-weight: 800; font-size: 1.1rem; } .show .where { margin-top: 2px; }
.amts { margin: 6px 0; } .amts button { padding-left: 4px; padding-right: 4px; }
  .card.encore { border: 2px solid var(--accent); } .enc-h { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
.artist{display:flex;gap:12px;align-items:center;margin:6px 0 10px;text-align:left}.artist img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid var(--accent,#c9a7ff)}.atag{font-weight:700}.abio{font-size:.92rem;line-height:1.35}
  .song.off { opacity: .45; cursor: default; } .song .na { color: var(--muted); font-size: .8rem; font-style: italic; }
  details.about summary { cursor: pointer; font-weight: 700; } details.about p { margin: 6px 0 0; }
  .bookf label { display: block; margin-top: 8px; font-weight: 600; }
</style>
</head>
<body>
<main id="app"><header><h1>Song requests</h1><p class="muted">Loading…</p></header></main>
