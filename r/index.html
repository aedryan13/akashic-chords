<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Song requests</title><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07060F;color:#EDE7FF;font:20px/1.4 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}a{color:#C9A7FF}</style>
</head><body><main id="m"><p>Opening the song request page…</p></main>
<script>
/* Short, permanent address for a performer's request page: <site>/r/<name>/ (or <site>/r/?<name>).
   The QR code points here and never changes; this page sends people on to the real page (Firebase project + performer id).
   If the Firebase project ever changes, only slugs.json changes, not the printed QR codes.
   Add ?shows, ?tip or ?more (or #shows...) to open that tab instead of the one picked in the app. */
(function () {
  var MAP = {"aedryan":{"name":"Aedryan Gantt","page":"beta/request/","k":"AIzaSyAiu-c-bn8FcQ49II4rs65UW3q8RiAyTjs","j":"akashic-requests","p":"gGyejPZPhvTa3BMArc47Xdo4dnl1"}};
  var path = location.pathname, i = path.lastIndexOf("/r/"), rest = i >= 0 ? path.slice(i + 3).split("/")[0] : "";
  var q = location.search.replace(/^\?/, "").split("&")[0], hash = location.hash.replace(/^#/, "");
  var tabs = { songs: 1, shows: 1, tip: 1, more: 1, links: 1, cal: 1 }, slug = decodeURIComponent(rest || (tabs[q] ? "" : q) || "").toLowerCase(), go = tabs[q] ? q : tabs[hash] ? hash : "";
  var e = MAP[slug];
  if (!e) {
    document.getElementById("m").innerHTML = "<p>That short address isn't set up.</p><p>Ask the performer for their QR code again.</p>";
    return;
  }
  var root = location.href.slice(0, location.href.indexOf("/r/") + 1);
  var url = root + e.page + "?k=" + encodeURIComponent(e.k) + "&j=" + encodeURIComponent(e.j) + "&p=" + encodeURIComponent(e.p) + "&via=short" + (go ? "&go=" + go : "");
  location.replace(url);
  document.getElementById("m").innerHTML = '<p><a href="' + url.replace(/"/g, "&quot;") + '">Tap here if the page doesn’t open</a></p>';
})();
</script></body></html>
